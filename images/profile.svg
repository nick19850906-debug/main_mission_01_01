<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 원형 배경 (부드러운 그라디언트) -->
  <circle cx="200" cy="200" r="180" fill="url(#bg-grad)" filter="url(#soft-shadow)"/>
  
  <!-- 개발자 아바타 일러스트 -->
  <g transform="translate(0, 10)">
    <!-- 몸체 / 옷 -->
    <path d="M120 340 C120 280, 280 280, 280 340 Z" fill="url(#shirt-grad)"/>
    <path d="M165 295 L200 325 L235 295 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- 목 -->
    <rect x="182" y="235" width="36" height="40" rx="8" fill="#fcd34d"/>
    
    <!-- 머리 / 얼굴 -->
    <ellipse cx="200" cy="180" rx="65" ry="75" fill="#fde68a"/>
    
    <!-- 귀 -->
    <circle cx="135" cy="180" r="14" fill="#fde68a"/>
    <circle cx="265" cy="180" r="14" fill="#fde68a"/>
    
    <!-- 안경 -->
    <circle cx="175" cy="175" r="22" fill="none" stroke="#1e1b4b" stroke-width="5"/>
    <circle cx="225" cy="175" r="22" fill="none" stroke="#1e1b4b" stroke-width="5"/>
    <line x1="197" y1="175" x2="203" y2="175" stroke="#1e1b4b" stroke-width="5"/>
    <line x1="135" y1="172" x2="153" y2="174" stroke="#1e1b4b" stroke-width="5"/>
    <line x1="247" y1="174" x2="265" y2="172" stroke="#1e1b4b" stroke-width="5"/>
    
    <!-- 눈동자 -->
    <circle cx="178" cy="175" r="5" fill="#1e1b4b"/>
    <circle cx="228" cy="175" r="5" fill="#1e1b4b"/>
    
    <!-- 미소 -->
    <path d="M185 210 Q200 225 215 210" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 머리카락 -->
    <path d="M130 160 C125 105, 275 100, 270 160 C260 120, 140 120, 130 160 Z" fill="#1e1b4b"/>
    <path d="M135 155 Q160 130 200 135 Q240 125 265 155 C250 140, 150 140, 135 155 Z" fill="#312e81"/>
    
    <!-- 노트북 / 코딩 무드 데코레이션 -->
    <rect x="130" y="325" width="140" height="20" rx="4" fill="#94a3b8"/>
    <polygon points="120,345 280,345 270,335 130,335" fill="#cbd5e1"/>
    <path d="M190 338 H210" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
